# Fly configuration for the public demo.
#
# One machine, always running, so no visitor pays a cold start. The image still
# ships an already-seeded database and a Machine restores its rootfs from the
# image on any restart, so a wrecked demo self-heals without a seeding step.

app = 'finance-playground'
primary_region = 'sin'
console_command = 'php /app/artisan tinker'

[build]

[env]
  # 🔴 Not 'production', and this is load-bearing. AppServiceProvider calls
  # DB::prohibitDestructiveCommands(app()->isProduction()), so under production
  # the 15-minute migrate:fresh would be refused every time and the demo would
  # never reset. fly launch wrote 'production' here by convention; the image
  # says 'demo' for exactly this reason and fly.toml [env] overrides the image.
  APP_ENV = 'demo'
  # Used where there is no request to infer from -- queued mail, artisan output.
  # In-request URLs come from the forwarded scheme, see trustProxies.
  APP_URL = 'https://finance-playground.fly.dev'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'

  # SESSION_DRIVER is deliberately NOT set here -- the image says 'database' and
  # that is the behaviour we want, so there is one place to read it from.
  # 🔴 Never 'cookie': selecting a role puts that role's whole permission list in
  # the session, 213 names and 6KB for Super Admin, and a browser silently drops
  # any cookie over 4KB. The role selector then bounces the visitor back to
  # itself forever, for every role.
  SESSION_SECURE_COOKIE = 'true'

[http_service]
  internal_port = 80
  force_https = true
  # The machine stays up. Cold wake measured at 21s -- VM start is only 1.1s of
  # that; the rest is the runtime's own boot and the proxy's retry backoff, and
  # neither is reachable from the entrypoint. Keeping one machine running is the
  # only thing that removes it, at roughly $3.32/month.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
